name: Trusted Wiki data checks

# This workflow takes effect only after it exists on the default branch.
# PR files are data: never execute their scripts or install their dependencies.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-data:
    name: Check PR data with base-branch tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check out PR as data
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: input
          # Fork content is read only by trusted scanners below; never run PR files.
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Confirm checked-out PR revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git -C input rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify PR remains current before inspection
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,baseRefOid |
            jq -e --arg head "$EXPECTED_HEAD" --arg base "$EXPECTED_BASE" \
              '.state == "OPEN" and .headRefOid == $head and .baseRefOid == $base' > /dev/null
      - name: Inspect untrusted data using trusted tools
        run: python3 -I "$GITHUB_WORKSPACE/trusted/tools/trusted_quality.py" "$GITHUB_WORKSPACE/input"
      - name: Verify PR remains current after inspection
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,baseRefOid |
            jq -e --arg head "$EXPECTED_HEAD" --arg base "$EXPECTED_BASE" \
              '.state == "OPEN" and .headRefOid == $head and .baseRefOid == $base' > /dev/null
