<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wiki PR 预览</title>
  <link rel="stylesheet" href="shell.css">
  <script src="shell.js" defer></script>
</head>
<body>
  <header class="notice" id="notice">
    <div class="notice-top"><strong>星穹铁道 · Wiki 预览</strong><a id="pr-link" rel="noopener noreferrer">查看 PR</a></div>
    <p><span id="pr-label">PR 预览</span> · 尚未合并 · <strong id="review-label">未经人工审查</strong></p>
    <p class="copyright">© 米哈游版权所有 · 非官方、非商业同人整理，与 HoYoverse 无关联。</p>
    <p id="status" role="status" aria-live="polite">正在验证预览版本…</p>
  </header>
  <main>
    <iframe id="preview" title="Wiki 预览内容" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe>
  </main>
</body>
</html>
